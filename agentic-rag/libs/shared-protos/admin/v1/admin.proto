syntax = "proto3";

package admin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/user/auth-service/gen/admin/v1;adminv1";

service AdminService {
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc UploadDocument(UploadDocumentRequest) returns (UploadDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc GetIngestionStatus(GetIngestionStatusRequest) returns (GetIngestionStatusResponse);
}

message Document {
  string id = 1;
  string filename = 2;
  string status = 3; // PENDING, PROCESSING, COMPLETED, FAILED
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  map<string, string> metadata = 6;
  string job_id = 7;
  string content_hash = 8;
  int32 progress = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  string error_code = 12;
  string error_message = 13;
}

message ListDocumentsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status_filter = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  int32 total_count = 2;
}

message UploadDocumentRequest {
  string filename = 1;
  bytes content = 2; // For simple small file uploads. For large files, use streaming or presigned URLs.
  string content_type = 3;
}

message UploadDocumentResponse {
  string id = 1;
  string status = 2;
  string job_id = 3;
  string content_hash = 4;
  int32 progress = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string error_code = 8;
}

message DeleteDocumentRequest {
  string id = 1;
}

message DeleteDocumentResponse {
  bool success = 1;
}

message GetIngestionStatusRequest {
  string id = 1;
}

message GetIngestionStatusResponse {
  string id = 1;
  string status = 2;
  string error_message = 3;
  string job_id = 4;
  string content_hash = 5;
  int32 progress = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  string error_code = 11;
}
