services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_app_demo
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superpassword
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_18_data:/var/lib/postgresql
      - ./scripts/docker/create-agent-database.sh:/docker-entrypoint-initdb.d/10-create-agent-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser -d web_app_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:1.3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_1_3_data:/data

  agent:
    build:
      context: ./services/agent
    restart: unless-stopped
    environment:
      AGENT_ENVIRONMENT: development
      AGENT_API_KEY: ${AGENT_API_KEY:-local-agent-dev-key-change-before-sharing}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql+asyncpg://superuser:superpassword@postgres:5432/agent}
      AGENT_POSTGRES_URL: ${AGENT_POSTGRES_URL:-postgresql://superuser:superpassword@postgres:5432/agent?sslmode=disable}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      AGENT_EMBEDDING_BASE_URL: ${AGENT_EMBEDDING_BASE_URL:-}
      AGENT_EMBEDDING_API_KEY: ${AGENT_EMBEDDING_API_KEY:-}
      AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-}
      AGENT_USE_RERANKER: ${AGENT_USE_RERANKER:-false}
      AGENT_CHROMA_HOST: chroma
      AGENT_CHROMA_PORT: 8000
      AGENT_UPLOAD_DIR: /data/uploads
      AGENT_CHROMA_PERSIST_DIRECTORY: /data/chroma
      AGENT_INGESTION_MAX_FILE_BYTES: 26214400
    ports:
      - "127.0.0.1:${AGENT_PORT:-8001}:8000"
    volumes:
      - agent_local_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  postgres_test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_app_demo_test
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superpassword
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-54330}:5432"
    volumes:
      - postgres_18_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser -d web_app_demo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional S3-compatible object storage for local development. Nothing needs it by default:
  # PRIVATE_STORAGE_DRIVER=filesystem stores uploads on disk with no container at all. Start
  # this only to exercise the real S3 path, with `bun run storage:local:start`.
  storage_s3:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    # `mini` runs master, volume, filer, and the S3 gateway in one process. Versioning and
    # object locking stay off: SeaweedFS mishandles conditional writes when they are enabled,
    # and conditional writes are what make an upload key write-once.
    command:
      - "mini"
      - "-dir=/data"
      - "-bucket=local-private-storage"
      - "-s3.port=8333"
      - "-admin.ui=false"
      - "-webdav=false"
    environment:
      # Deliberately literal and obviously fake. Reading these from the shell would let real
      # cloud credentials leak into a development container.
      AWS_ACCESS_KEY_ID: local-private-storage-not-a-real-key
      AWS_SECRET_ACCESS_KEY: local-private-storage-not-a-real-secret-do-not-use-in-production
    ports:
      - "127.0.0.1:${PRIVATE_STORAGE_S3_PORT:-24331}:8333"
    volumes:
      - seaweedfs_4_41_data:/data
    healthcheck:
      # The master reports cluster readiness; the S3 port parses an unknown path as a bucket
      # name, so it cannot answer a health probe.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_18_data:
  postgres_18_test_data:
  seaweedfs_4_41_data:
  chroma_1_3_data:
  agent_local_data:
