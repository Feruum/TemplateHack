name: agentic-rag-monorepo

services:
  traefik:
    image: traefik:v3.6
    profiles: [ "dev", "staging", "prod" ]
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik:/etc/traefik:ro
    networks:
      - traefik-public
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"

  postgres:
    image: postgres:16-alpine
    profiles: [ "dev", "staging", "prod" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - default
      - traefik-public
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.6.3
    profiles: [ "dev", "staging", "prod" ]
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - default
      - traefik-public
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chroma.rule=Host(`chroma.localhost`)"
      - "traefik.http.routers.chroma.entrypoints=web"
      - "traefik.http.services.chroma.loadbalancer.server.port=8000"

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    profiles: [ "dev", "staging", "prod" ]
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    networks:
      - default
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v1.1.0
    profiles: [ "dev", "staging", "prod" ]
    env_file:
      - envs/${APP_ENV:-dev}/.env
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./infra/kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yaml migrate sql -e --yes
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.1.0
    profiles: [ "dev", "staging", "prod" ]
    env_file:
      - envs/${APP_ENV:-dev}/.env
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      maildev:
        condition: service_started
        required: false
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
      - LOG_LEVEL=debug
    volumes:
      - ./infra/kratos:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.yaml --watch-courier
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kratos-public.rule=Host(`kratos.localhost`)"
      - "traefik.http.routers.kratos-public.entrypoints=web"
      - "traefik.http.services.kratos-public.loadbalancer.server.port=4433"
      - "traefik.http.routers.kratos-admin.rule=Host(`kratos-admin.localhost`)"
      - "traefik.http.routers.kratos-admin.entrypoints=web"
      - "traefik.http.services.kratos-admin.loadbalancer.server.port=4434"

  spicedb:
    image: authzed/spicedb:v1.29.0
    profiles: [ "dev", "staging", "prod" ]
    command: serve --grpc-preshared-key "${SPICEDB_PRESHARED_KEY:-somerandomkeyhere}" --readonly-grpc-preshared-key "${SPICEDB_READONLY_KEY:-readonlykey}" --datastore-engine postgres --datastore-conn-uri "postgres://postgres:postgres@postgres:5432/spicedb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=:50051" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spicedb.rule=Host(`spicedb.localhost`)"
      - "traefik.http.routers.spicedb.entrypoints=web"
      - "traefik.http.services.spicedb.loadbalancer.server.port=8443"

  maildev:
    image: maildev/maildev
    profiles: [ "dev" ]
    environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maildev.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.maildev.entrypoints=web"
      - "traefik.http.services.maildev.loadbalancer.server.port=1080"

  auth-service:
    build:
      context: apps/auth-service
      dockerfile: Dockerfile
    profiles: [ "dev", "staging", "prod" ]
    env_file:
      - envs/${APP_ENV:-dev}/.env
    depends_on:
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started
      spicedb:
        condition: service_started
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - AUTH_SERVER_ADDR=:8081
      - HTTP_PORT=8081
      - GRPC_PORT=50052
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.localhost`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8081"

  agent:
    build:
      context: apps/agent
      dockerfile: Dockerfile
    profiles: [ "dev", "staging", "prod" ]
    env_file:
      - envs/${APP_ENV:-dev}/.env
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started
      chroma:
        condition: service_started
    environment:
      - AGENT_ENV=${APP_ENV:-dev}
      - PYTHONPATH=/app/src:/app/src/agent/gen
    volumes:
      - ./apps/agent/src:/app/src:ro
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=Host(`agent.localhost`)"
      - "traefik.http.routers.agent.entrypoints=web"
      - "traefik.http.services.agent.loadbalancer.server.port=8000"

  admin-dashboard:
    build:
      context: apps/admin-dashboard
      dockerfile: Dockerfile
    profiles: [ "dev", "staging", "prod" ]
    env_file:
      - envs/${APP_ENV:-dev}/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - AGENT_SERVICE_URL=http://agent:8000
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_started
      agent:
        condition: service_started
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-dashboard.rule=Host(`dashboard.localhost`)"
      - "traefik.http.routers.admin-dashboard.entrypoints=web"
      - "traefik.http.services.admin-dashboard.loadbalancer.server.port=3000"

networks:
  traefik-public:
    name: traefik-public
  default:

volumes:
  postgres_data:
  dragonfly_data:
  chroma_data:
